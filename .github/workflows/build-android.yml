name: Build Android app

# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android project
        run: |
          flutter --version
          if [ ! -d android ]; then
            flutter create --platforms=android --org io.github.aliakbarmehdizadeh --project-name human_or_ai .
          fi

      - name: Apply app name, ID, icon and signing setup
        run: python3 tool/configure_android.py

      - name: Check the code
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Install the upload key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build test APK (install directly on your phone)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build Play Store bundle (.aab)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Warn if signing secrets are missing
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: echo "::warning::No KEYSTORE_BASE64 secret, so no Play Store bundle was built. See PUBLISHING.md step 3."

      - uses: actions/upload-artifact@v4
        with:
          name: human-or-ai-build-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
